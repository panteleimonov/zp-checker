<!doctype html>
<html lang="uk">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>ZP Checker</title>

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Google+Sans:opsz,wght,GRAD@17..18,400..700,-50..200&family=Rubik:wght@300..900&display=swap"
			rel="stylesheet"
		/>

		<link rel="stylesheet" href="style-light.css" />
	</head>

	<body>
		<header class="header">
			<div class="logo-header">
				<img src="./assets/logo_money-96.png" alt="Logo" class="logo" />
				<span class="emoji-icon">💸</span>
				<h1>ZP Checker</h1>
			</div>
			<p class="caption-text">
				Наближений розрахунок заробітної плати. Введіть свої дані щоб побачити
				зарплату за місяць. Окремі поля форм заповнюються лише в разі потреби.
			</p>
		</header>

		<section class="main">
			<form id="app-form" action="#">
				<!-- ================= ГОЛОВНЕ ================= -->
				<fieldset class="general-field">
					<legend>📌 Головне</legend>

					<div class="input-wrapper">
						<label for="oklad">Оклад (поточний) грн.</label>
						<input
							class="large tls"
							type="text"
							inputmode="numeric"
							id="oklad"
							__required
							placeholder="Сума"
						/>
					</div>

					<div class="input-wrapper">
						<label for="shkid">Надбавка за шкідливість %</label>
						<input
							class="tls"
							type="text"
							inputmode="numeric"
							id="shkid"
							__required
							placeholder="Процент"
						/>
					</div>

					<div class="input-wrapper">
						<label for="bezper_stag">Доплата за б/п стаж %</label>
						<input
							class="tls"
							type="text"
							inputmode="numeric"
							id="bezper_stag"
							__required
							placeholder="Процент"
						/>
					</div>
				</fieldset>

				<!-- ================= ТАБЕЛЮВАННЯ ================= -->
				<fieldset class="tab-field">
					<legend>🗓️ Табелювання</legend>

					<div class="inputs-group">
						<div class="input-wrapper">
							<label for="planed_work_days">Заплановано робочих днів</label>
							<input
								type="text"
								inputmode="numeric"
								id="planed_work_days"
								__required
								placeholder="Всього"
							/>
						</div>

						<div class="input-wrapper">
							<label for="real_work_days">Відпрацьовано днів / змін</label>
							<input
								type="text"
								inputmode="numeric"
								id="real_work_days"
								__required
								placeholder="Всього"
							/>
						</div>

						<div class="input-wrapper">
							<label for="days_for_avans">До 15-го числа (включно)</label>
							<input
								type="text"
								inputmode="numeric"
								id="days_for_avans"
								__required
								placeholder="Всього"
							/>
						</div>
					</div>

					<div class="inputs-group">
						<div class="input-wrapper">
							<label for="evn_d">Вечірні зміни</label>
							<div class="double-inputs">
								<input
									type="text"
									inputmode="numeric"
									id="evn_d"
									__required
									placeholder="Всього"
								/>
								<span>або</span>
								<input
									type="text"
									inputmode="numeric"
									id="evn_h"
									__required
									placeholder="Години"
								/>
							</div>
						</div>

						<div class="input-wrapper">
							<label for="night_d">Нічні зміни</label>
							<div class="double-inputs">
								<input
									type="text"
									inputmode="numeric"
									id="night_d"
									__required
									placeholder="Всього"
								/>
								<span>або</span>
								<input
									type="text"
									inputmode="numeric"
									id="night_h"
									__required
									placeholder="Години"
								/>
							</div>
						</div>
					</div>
				</fieldset>

				<!-- ================= НАРАХУВАННЯ ================= -->
				<fieldset>
					<legend>✅ Нарахування</legend>
					<div class="inputs-group">
						<div class="input-wrapper">
							<label for="prem">Премія (за рез. роботи) %</label>
							<input
								class="tls"
								type="text"
								inputmode="numeric"
								id="prem"
								__required
								placeholder="Процент"
							/>
						</div>

						<div class="input-wrapper">
							<label for="pop_oklad">Оклад за попередній місяць</label>
							<input
								class="large"
								type="text"
								inputmode="numeric"
								id="pop_oklad"
								__required
								placeholder="Сума"
							/>
						</div>
					</div>
					<div class="inputs-group">
						<div class="input-wrapper">
							<label for="vidp_days">Відпустка (кількість днів)</label>
							<input
								type="text"
								inputmode="numeric"
								id="vidp_days"
								placeholder="Всього"
							/>
						</div>

						<div class="input-wrapper">
							<label for="komp_days">Компенсація (кількість днів)</label>
							<input
								type="text"
								inputmode="numeric"
								id="komp_days"
								placeholder="Всього"
							/>
						</div>

						<div class="input-wrapper">
							<label for="mater_dop">Матеріальна допомога</label>
							<input
								class="large"
								type="text"
								inputmode="numeric"
								id="mater_dop"
								placeholder="Сума"
							/>
						</div>
					</div>

					<div class="inputs-group">
						<div class="input-wrapper">
							<label for="gram_pod">Премія за грамоту / подяку</label>
							<input
								class="large"
								type="text"
								inputmode="numeric"
								id="gram_pod"
								placeholder="Сума"
							/>
						</div>

						<div class="input-wrapper">
							<label for="pidg_pers">Доплата за підг. персоналу</label>
							<input
								class="large"
								type="text"
								inputmode="numeric"
								id="pidg_pers"
								placeholder="Сума"
							/>
						</div>

						<div class="input-wrapper">
							<label for="others_nar">Інші нарахування (грн.)</label>
							<input
								class="large"
								type="text"
								inputmode="numeric"
								id="others_nar"
								placeholder="Сума"
							/>
						</div>
					</div>
				</fieldset>

				<!-- ================= ВІДРАХУВАННЯ ================= -->
				<fieldset class="red-bg">
					<legend>🔥 Відрахування</legend>

					<div class="inputs-group">
						<div class="input-wrapper">
							<label for="member_prof">Членство у профспілці (1%)</label>
							<input type="checkbox" id="member_prof" name="prof" checked />
						</div>

						<div class="input-wrapper">
							<label for="blag_vnes">Благодійні внески (1.5% / 3.5%)</label>
							<input type="checkbox" id="blag_vnes" name="vnes" checked />
						</div>
					</div>

					<div class="inputs-group">
						<div class="input-wrapper">
							<label for="med_polis">Медичне страхування (поліс)</label>
							<input
								class="large"
								type="text"
								inputmode="numeric"
								id="med_polis"
								placeholder="Сума"
							/>
						</div>

						<div class="input-wrapper">
							<label for="others_vidr">Інші відрахування (грн.)</label>
							<input
								class="large"
								type="text"
								inputmode="numeric"
								id="others_vidr"
								placeholder="Сума"
							/>
						</div>
					</div>
				</fieldset>

				<div class="btns-wrapper">
					<button class="reset-btn" type="reset">Очистити</button>
					<button class="start-calc" type="submit">Рахувати</button>
				</div>
			</form>
			<div id="result"></div>
		</section>

		<script src="main.js" defer></script>
		<script src="app.js" defer></script>
	</body>
</html>
