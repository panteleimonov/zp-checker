<!doctype html>
<html lang="uk">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>ZP Checker</title>

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
			rel="stylesheet"
		/>

		<link rel="stylesheet" href="style-ui.css" />
	</head>

	<body>
		<header class="header">
			<h1 class="logo-header">💸 ZP Checker</h1>
		</header>

		<section class="main">
			<p class="caption-text">
				Наближений розрахунок заробітної плати. Введіть свої дані щоб побачити
				зарплату за місяць. Окремі поля форм заповнюються лише в разі потреби.
			</p>

			<form action="#">
				<!-- ================= ГОЛОВНЕ ================= -->
				<fieldset class="general-field">
					<legend>
						<h3>📌 Головне</h3>
					</legend>

					<div class="input-wrapper">
						<label for="oklad">Оклад (поточний) грн.</label>
						<input
							class="large tls"
							type="text"
							inputmode="numeric"
							id="oklad"
							required
							placeholder="Сума"
						/>
					</div>

					<div class="input-wrapper">
						<label for="shkid">Надбавка за шкідливість %</label>
						<input
							class="tls"
							type="text"
							inputmode="numeric"
							id="shkid"
							required
							placeholder="Процент"
						/>
					</div>

					<div class="input-wrapper">
						<label for="bonus">Доплата за б/п стаж %</label>
						<input
							class="tls"
							type="text"
							inputmode="numeric"
							id="bonus"
							required
							placeholder="Процент"
						/>
					</div>
				</fieldset>

				<!-- ================= ТАБЕЛЮВАННЯ ================= -->
				<fieldset class="tab-field">
					<legend>
						<h3>🗓️ Табелювання</h3>
					</legend>

					<div class="inputs-group">
						<div class="input-wrapper">
							<label for="planed-days">Заплановано робочих днів</label>
							<input
								type="text"
								inputmode="numeric"
								id="planed-days"
								required
								placeholder="Всього"
							/>
						</div>

						<div class="input-wrapper">
							<label for="work-days">Відпрацьовано днів / змін</label>
							<input
								type="text"
								inputmode="numeric"
								id="work-days"
								required
								placeholder="Всього"
							/>
						</div>

						<div class="input-wrapper">
							<label for="days-for-avans">До 15-го числа (включно)</label>
							<input
								type="text"
								inputmode="numeric"
								id="days-for-avans"
								required
								placeholder="Всього"
							/>
						</div>
					</div>

					<div class="inputs-group">
						<div class="input-wrapper">
							<label for="evn-d">Вечірні зміни</label>
							<div class="double-inputs">
								<input
									type="text"
									inputmode="numeric"
									id="evn-d"
									required
									placeholder="Всього"
								/>
								<span>або</span>
								<input
									type="text"
									inputmode="numeric"
									id="evn-h"
									required
									placeholder="Години"
								/>
							</div>
						</div>

						<div class="input-wrapper">
							<label for="night-d">Нічні зміни</label>
							<div class="double-inputs">
								<input
									type="text"
									inputmode="numeric"
									id="night-d"
									required
									placeholder="Всього"
								/>
								<span>або</span>
								<input
									type="text"
									inputmode="numeric"
									id="night-h"
									required
									placeholder="Години"
								/>
							</div>
						</div>
					</div>
				</fieldset>

				<!-- ================= НАРАХУВАННЯ ================= -->
				<fieldset>
					<legend>
						<h3>✅ Нарахування</h3>
					</legend>
					<div class="inputs-group">
						<div class="input-wrapper">
							<label for="prem">Премія (за рез. роботи) %</label>
							<input
								class="tls"
								type="text"
								inputmode="numeric"
								id="prem"
								required
								placeholder="Процент"
							/>
						</div>

						<div class="input-wrapper">
							<label for="pop-okl">Оклад за попередній місяць</label>
							<input
								class="large"
								type="text"
								inputmode="numeric"
								id="pop-okl"
								required
								placeholder="Сума"
							/>
						</div>
					</div>
					<div class="inputs-group">
						<div class="input-wrapper">
							<label for="vidp">Відпустка (кількість днів)</label>
							<input
								class=""
								type="text"
								inputmode="numeric"
								id="vidp"
								placeholder="Всього"
							/>
						</div>

						<div class="input-wrapper">
							<label for="komp">Компенсація (кількість днів)</label>
							<input
								class=""
								type="text"
								inputmode="numeric"
								id="komp"
								placeholder="Всього"
							/>
						</div>

						<div class="input-wrapper">
							<label for="mat-d">Матеріальна допомога</label>
							<input
								class="large"
								type="text"
								inputmode="numeric"
								id="mat-d"
								placeholder="Сума"
							/>
						</div>
					</div>

					<div class="inputs-group">
						<div class="input-wrapper">
							<label for="gram-pod">Премія за грамоту / подяку</label>
							<input
								class="large"
								type="text"
								inputmode="numeric"
								id="gram-pod"
								placeholder="Сума"
							/>
						</div>

						<div class="input-wrapper">
							<label for="pidg-pers">Доплата за підг. персоналу</label>
							<input
								class="large"
								type="text"
								inputmode="numeric"
								id="pidg-pers"
								placeholder="Сума"
							/>
						</div>

						<div class="input-wrapper">
							<label for="others-nar">Інші нарахування (грн.)</label>
							<input
								class="large"
								type="text"
								inputmode="numeric"
								id="others-nar"
								placeholder="Сума"
							/>
						</div>
					</div>
				</fieldset>

				<!-- ================= ВІДРАХУВАННЯ ================= -->
				<fieldset class="red-bg">
					<legend>
						<h3>🔁 Відрахування</h3>
					</legend>

					<div class="inputs-group">
						<div class="input-wrapper">
							<label for="prof">Членство у профспілці (1%)</label>
							<input type="checkbox" id="prof" name="prof" checked />
						</div>

						<div class="input-wrapper">
							<label for="vnes">Благодійні внески (1.5% / 3.5%)</label>
							<input type="checkbox" id="vnes" name="vnes" checked />
						</div>
					</div>

					<div class="inputs-group">
						<div class="input-wrapper">
							<label for="medstrah">Поліс мед. страхування</label>
							<input
								class="large"
								type="text"
								inputmode="numeric"
								id="medstrah"
								placeholder="Сума"
							/>
						</div>

						<div class="input-wrapper">
							<label for="others">Інші відрахування (грн.)</label>
							<input
								class="large"
								type="text"
								inputmode="numeric"
								id="others"
								placeholder="Сума"
							/>
						</div>
					</div>
				</fieldset>

				<div class="btns-wrapper">
					<button class="reset-btn" type="reset">Очистити</button>
					<button class="start-calc" type="submit">Рахувати</button>
				</div>
			</form>
		</section>

		<script src="main.js"></script>
	</body>
</html>
